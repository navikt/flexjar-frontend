name: workflow
on:
  workflow_dispatch:
  push:

jobs:
  felles-workflow:
    uses: navikt/flex-github-actions-workflows/.github/workflows/next-js-lightweight.yml@main
    permissions:
      packages: read
      contents: read
      id-token: write
      security-events: write
      actions: read
    secrets: inherit

  playwright_versjon:
    runs-on: ubuntu-latest
    outputs:
      playwright-version: ${{ steps.playwright-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Hent Playwright-versjon
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> $GITHUB_OUTPUT

  playwright:
    needs: playwright_versjon
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright_versjon.outputs.playwright-version }}-noble
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install npm dependencies
        run: npm ci
        env:
          NPM_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      - name: Build application
        run: npm run build
      - name: Run Playwright
        run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
